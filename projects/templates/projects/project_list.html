<!DOCTYPE html>
<html>
<head>
    <title>Student Projects</title>
</head>
<body>

    <h1>Registered Student Projects</h1>

    {% for project in projects %}
        <h2>{{ project.title }}</h2>
        <p>{{ project.description }}</p>
        <p>{{ project.created_at }}</p>
        <hr>
    {% empty %}
        <p>No projects have been registered yet.</p>
    {% endfor %}

</body>
</html>
