{% extends 'projects/base.html' %}

{% block content %}
<h2>Project List</h2>

<!-- Search Form -->
<form method="get" action="{% url 'project_list' %}" class="search-form">
    <input type="text" name="q" value="{{ query }}" placeholder="Search by title...">
    <button type="submit">Search</button>
</form>

<a href="{% url 'project_create' %}" class="btn">Add New Project</a>

<table class="project-table">
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for project in projects %}
        <tr>
            <td>{{ project.title }}</td>
            <td>{{ project.description }}</td>
            <td>
                <a href="{% url 'project_update' project.pk %}">Edit</a> |
                <a href="{% url 'project_delete' project.pk %}">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No projects found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
